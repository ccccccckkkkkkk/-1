name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 镜像已预装完整 Android SDK（platforms / build-tools / NDK /
      # cmdline-tools/latest）。不要再跑 android-actions/setup-android：它会强制
      # 降级到 cmdline-tools/16.0 并尝试安装早已下线的 "tools" 包，直接失败。
      - name: Prepare Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          BIN="$SDK/cmdline-tools/latest/bin"
          if [ ! -x "$BIN/sdkmanager" ]; then
            BIN=$(dirname "$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)")
          fi
          echo "$BIN" >> $GITHUB_PATH
          echo "SDKMAN=$BIN/sdkmanager" >> $GITHUB_ENV
          "$BIN/sdkmanager" --version

      - name: Accept SDK licenses
        run: yes | "$SDKMAN" --licenses > /dev/null || true

      - name: Install SDK packages
        run: |
          "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonFlick-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
